server:
  port: 8091

spring:
  application:
    name: sclera-identity

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

dapr:
  http-port: ${DAPR_HTTP_PORT:3500}
  grpc-port: ${DAPR_GRPC_PORT:50001}

logging:
  level:
    io.sclera.identity: INFO
    io.dapr: INFO
