server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index traces.html;

    # Same-origin reverse proxy to each service's actuator/health (and the gateway),
    # so the traces page can ping them without hitting CORS (services only allow :3000).
    location /svc/8080/ { proxy_pass http://sclera-api-gateway:8080/; }
    location /svc/8085/ { proxy_pass http://sclera-cloud-device-asset:8085/; }
    location /svc/8089/ { proxy_pass http://vdms-service:8089/; }
    location /svc/8090/ { proxy_pass http://sclera-audit:8090/; }
    location /svc/8091/ { proxy_pass http://sclera-identity:8091/; }
    location /svc/8092/ { proxy_pass http://sclera-alerts:8092/; }
    location /svc/8093/ { proxy_pass http://sclera-inventory:8093/; }
    location /svc/8094/ { proxy_pass http://sclera-workorders:8094/; }
    location /svc/8095/ { proxy_pass http://sclera-inspection:8095/; }
    location /svc/8096/ { proxy_pass http://sclera-integrations:8096/; }
    location /svc/8097/ { proxy_pass http://sclera-edge:8097/; }

    location / {
        try_files $uri $uri/ /traces.html;
    }
}
