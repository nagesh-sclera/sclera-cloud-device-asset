server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index traces.html;

    # Docker's embedded DNS. Using a variable upstream + this resolver makes nginx
    # re-resolve the service container IP on each request, so it survives container
    # recreation (a static proxy_pass caches the IP at startup and 502s after a
    # service is recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/svc/8080/(.*)$ { set $u sclera-api-gateway:8080;        proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8085/(.*)$ { set $u sclera-cloud-device-asset:8085; proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8089/(.*)$ { set $u vdms-service:8089;              proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8090/(.*)$ { set $u sclera-audit:8090;             proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8091/(.*)$ { set $u sclera-identity:8091;          proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8092/(.*)$ { set $u sclera-alerts:8092;            proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8093/(.*)$ { set $u sclera-inventory:8093;         proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8094/(.*)$ { set $u sclera-workorders:8094;        proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8095/(.*)$ { set $u sclera-inspection:8095;        proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8096/(.*)$ { set $u sclera-integrations:8096;      proxy_pass http://$u/$1$is_args$args; }
    location ~ ^/svc/8097/(.*)$ { set $u sclera-edge:8097;              proxy_pass http://$u/$1$is_args$args; }

    location / {
        try_files $uri $uri/ /traces.html;
    }
}
