      DAPR_GRPC_PORT: "50001"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDMETHODS: "GET"
