services:

  postgres:
    image: postgres:16
    container_name: sclera-postgres
    environment:
      POSTGRES_DB: sclera_assets
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mypass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - sclera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d sclera_assets"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sclera-redis
    networks:
      - sclera-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: sclera-cloud-device-asset/Dockerfile
    container_name: sclera-cloud-device-asset
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/sclera_assets
      DB_USER: root
      DB_PASS: mypass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      SPRING_FLYWAY_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDMETHODS: "GET"
      # Expose the Micrometer/Prometheus scrape endpoint at /actuator/prometheus for Prometheus.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
      MANAGEMENT_METRICS_TAGS_APPLICATION: "sclera-cloud-device-asset"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/agent.jar"
      OTEL_SERVICE_NAME: "sclera-cloud-device-asset"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_TRACES_EXPORTER: "otlp"
      # Export JVM/HTTP/DB metrics to the collector (which re-exposes them in Prometheus format on :9464).
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage,b3"
      # Capture "everything that comes in": request/response headers + full (un-sanitized) SQL on spans.
      # Request/response BODIES are added by the app's PayloadTracingFilter (io.sclera.config).
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_REQUEST_HEADERS: "content-type,accept,user-agent,host,authorization,x-forwarded-for,referer,x-request-id"
      OTEL_INSTRUMENTATION_HTTP_SERVER_CAPTURE_RESPONSE_HEADERS: "content-type,content-length,content-disposition"
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_REQUEST_HEADERS: "content-type,accept"
      OTEL_INSTRUMENTATION_HTTP_CLIENT_CAPTURE_RESPONSE_HEADERS: "content-type,content-length"
      OTEL_INSTRUMENTATION_COMMON_DB_STATEMENT_SANITIZER_ENABLED: "false"
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
      # Persist uploaded asset images (served back at /images/** by ResourceConfigs) so they
      # survive container rebuilds/recreates, same store layout as the root project.
      - sclera-images:/home/sclera/images
    ports:
      - "8085:8085"
      - "3500:3500"
    networks:
      - sclera-net
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "sclera-cloud-device-asset",
      "--app-port", "8085",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--dapr-listen-addresses", "0.0.0.0",
      "--placement-host-address", "",
      "--config", "/dapr/config.yaml",
      "--resources-path", "/dapr/components",
      "--log-level", "info"
    ]
    volumes:
      - ./sclera-cloud-device-asset/dapr:/dapr
    network_mode: "service:app"
    restart: on-failure
    depends_on:
      - app
      - redis

  measuring-instrument:
    build:
      context: ./sclera_cloud_measuring_instrument
      dockerfile: Dockerfile
    container_name: sclera-cloud-measuring-instrument
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sclera_cloud_measuring_instrument
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mypass123
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/agent.jar"
      OTEL_SERVICE_NAME: "sclera-cloud-measuring-instrument"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_PROPAGATORS: "tracecontext,baggage,b3"
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
    ports:
      - "8086:8086"
    networks:
      - sclera-net
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  measuring-instrument-dapr:
    image: daprio/daprd:1.12.0
    command: ["./daprd",
      "--app-id", "sclera-cloud-measuring-instrument", "--app-port", "8086",
      "--dapr-http-port", "3500", "--dapr-grpc-port", "50001",
      "--dapr-listen-addresses", "0.0.0.0",
      "--placement-host-address", "",
      "--config", "/dapr/config.yaml",
      "--resources-path", "/dapr/components",
      "--log-level", "info"]
    volumes: ["./sclera-cloud-device-asset/dapr:/dapr"]
    network_mode: "service:measuring-instrument"
    restart: on-failure
    depends_on: [measuring-instrument, redis]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: sclera-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    networks:
      - sclera-net
    restart: on-failure
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sclera-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - sclera-net
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sclera-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - sclera-net
    restart: on-failure
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sclera-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Allow dashboards to auto-refresh faster than the 5s default (near-live logs).
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    networks:
      - sclera-net
    restart: on-failure
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    container_name: sclera-loki
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - sclera-net
    restart: on-failure

  promtail:
    image: grafana/promtail:3.1.1
    container_name: sclera-promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sclera-net
    restart: on-failure
    depends_on:
      - loki

  # Trimmed 2026-07-10 to a two-service workspace: vdms-service, sclera-workorders and
  # sclera-api-gateway (plus the httpbin/mailhog dev helpers) were removed. Only
  # sclera-cloud-device-asset (`app`) + observability infra run here. The measuring-instrument
  # service runs from its own repo (sclera_cloud_measuring_instrument/docker-compose.yml), or is
  # added to this stack via the Phase-2 Round-2 plan (Task 1).

networks:
  sclera-net:
    driver: bridge

volumes:
  pgdata:
  grafana-data:
  loki-data:
  sclera-images:
