services:

  postgres:
    image: postgres:16
    container_name: sclera-postgres
    environment:
      POSTGRES_DB: vdms
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mypass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - sclera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vdms"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: sclera-redis
    networks:
      - sclera-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./sclera-cloud-device-asset
    container_name: sclera-cloud-device-asset
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/vdms
      DB_USER: root
      DB_PASS: mypass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      SPRING_FLYWAY_ENABLED: "false"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDMETHODS: "GET"
    ports:
      - "8085:8085"
    networks:
      - sclera-net
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "sclera-cloud-device-asset",
      "--app-port", "8085",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "",
      "--config", "/dapr/config.yaml",
      "--resources-path", "/dapr/components",
      "--log-level", "info"
    ]
    volumes:
      - ./sclera-cloud-device-asset/dapr:/dapr
    network_mode: "service:app"
    restart: on-failure
    depends_on:
      - app
      - redis

  vdms-service:
    build: ./sclera-vdms-service
    container_name: vdms-service
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/vdms
      DB_USER: root
      DB_PASS: mypass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: vdms_svc
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWEDMETHODS: "GET"
    ports:
      - "8089:8089"
    networks:
      - sclera-net
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  vdms-dapr:
    image: daprio/daprd:1.12.0
    command: [
      "./daprd",
      "--app-id", "vdms-service",
      "--app-port", "8089",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "",
      "--config", "/dapr/config.yaml",
      "--resources-path", "/dapr/components",
      "--log-level", "info"
    ]
    volumes:
      - ./sclera-cloud-device-asset/dapr:/dapr
    network_mode: "service:vdms-service"
    restart: on-failure
    depends_on:
