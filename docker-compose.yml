      "--resources-path", "/dapr/components",
      "--log-level", "info"]
    volumes: ["./sclera-cloud-device-asset/dapr:/dapr"]
    network_mode: "service:api-gateway"
    restart: on-failure
    depends_on: [api-gateway, redis, otel-collector]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: sclera-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    networks:
      - sclera-net
    restart: on-failure
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: sclera-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - sclera-net
    restart: on-failure

  httpbin:
    image: kennethreitz/httpbin:latest
    container_name: sclera-httpbin
    networks:
      - sclera-net
    restart: on-failure

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sclera-mailhog
    ports:
      - "8025:8025"
    networks:
      - sclera-net
    restart: on-failure

  ui:
    image: nginx:alpine
    container_name: sclera-test-ui
    ports:
      - "3000:80"
    volumes:
      - ./test-ui:/usr/share/nginx/html:ro
    networks:
      - sclera-net

networks:
  sclera-net:
    driver: bridge

volumes:
  pgdata:
