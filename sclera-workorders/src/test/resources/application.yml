# H2-backed test config so tests run without Postgres or Dapr.
# PostgreSQL mode keeps the upsert ON CONFLICT syntax close to production —
# but the ON CONFLICT / EXCLUDED rewrite is not 100% H2-compatible, so the
# repository slice test uses a simpler probe rather than the full upsert.

spring:
  datasource:
    url: jdbc:h2:mem:maximo_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  sql:
    init:
      mode: never        # let Hibernate create from entities

dapr:
  http-port: 3501
  vdms-app-id: vdms-service

logging:
  # Write rolling log files during test runs (LOG_PATH=./logs -> <module>/logs).
  config: classpath:logback/logback-development.xml
  level:
    root: WARN
    io.sclera: INFO
