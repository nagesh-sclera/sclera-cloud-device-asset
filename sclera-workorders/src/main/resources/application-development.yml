# development profile — local development (Docker via docker-compose.override.yml, or IDE).
# DB comes from env (DB_URL/DB_USER/DB_PASSWORD); in Docker these point at the `postgres`
# container, in the IDE they default to localhost. Logs go to ./logs via logback-development.
spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/workorder_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mypass123}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  config: classpath:logback/logback-development.xml
  level:
    io.sclera: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
