# Default profile = "docker" (docker-compose.yml). Local development uses the
# "development" profile (docker-compose.override.yml, auto-applied by `docker compose up`,
# or SPRING_PROFILES_ACTIVE=development from the IDE).

spring:
  application:
    name: sclera-cloud-workorder
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/workorder_db}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:mypass123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update    # creates tables on first boot; switch to "validate" + Flyway for prod
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is used only as a cache here, not for Spring Data Redis repositories.
      # Disable repository scanning so it doesn't inspect the JPA repositories.
      repositories:
        enabled: false

server:
  port: ${APP_PORT:8092}
  servlet:
    context-path: ${CONTEXT_PATH:/api/v1/workorder-service}

dapr:
  http-port:           ${DAPR_HTTP_PORT:3501}
  vdms-app-id:         ${VDMS_APP_ID:vdms-service}
  device-asset-app-id: ${DEVICE_ASSET_APP_ID:sclera-cloud-device-asset}
  pubsub-name:         pubsub
  topic-name:          ${DAPR_TOPIC_NAME:user-action-log-events}

# Background jobs triggered by the Dapr cron binding (schedule lives in the component YAML).
jobs:
  enabled:        ${JOBS_ENABLED:true}
  max-attempts:   ${JOBS_MAX_ATTEMPTS:3}
  retry-delay-ms: ${JOBS_RETRY_DELAY_MS:1000}
  dlq-topic:      ${JOBS_DLQ_TOPIC:jobs-dlq}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  config: classpath:logback/logback.xml
  level:
    root: INFO
    io.sclera: DEBUG
    org.hibernate.SQL: WARN
