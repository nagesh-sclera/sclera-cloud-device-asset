# Standalone compose for the Sclera Asset Management UI.
# The browser calls the API gateway (default http://localhost:8080) directly,
# so this service only needs to serve the static build on port 3000 — the only
# origin the gateway CORS allow-list permits for a frontend.
#
# Bring up the backend separately (from the repo root):  docker compose up -d
# Then:                                                   docker compose -f sclera-ui/docker-compose.yml up -d --build
services:
  sclera-asset-ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Change this to point the UI at QA/prod instead of local.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
        VITE_DEMO_USER: ${VITE_DEMO_USER:-admin}
        VITE_DEMO_DISPLAY: ${VITE_DEMO_DISPLAY:-Master User}
        VITE_DEMO_VDMS: ${VITE_DEMO_VDMS:-VDMS760}
        VITE_DEMO_DOCKER: ${VITE_DEMO_DOCKER:-right_wing}
    container_name: sclera-asset-ui
    ports:
      - "3000:80"
    restart: unless-stopped
