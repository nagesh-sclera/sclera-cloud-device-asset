server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .mjs isn't in nginx's default mime.types → it serves application/octet-stream,
    # which browsers reject for module scripts/workers (pdf.js loads its worker as .mjs).
    # This regex location wins over /assets/ for .mjs files and forces a JS MIME type.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # cache hashed assets aggressively
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
