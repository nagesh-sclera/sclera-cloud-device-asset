# Promtail discovers every container in this compose project via the Docker API (the mounted
# /var/run/docker.sock), tails their stdout/stderr live, and pushes to Loki. Labels let Grafana
# filter by service/container.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only this stack's containers (skip other compose projects on the host).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: 'sclera-cloud-device-asset'
        action: keep
      # service = compose service name (app, postgres, api-gateway, …)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # container = full container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # stream = stdout|stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
