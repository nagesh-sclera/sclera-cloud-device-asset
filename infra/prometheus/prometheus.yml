# Prometheus scrape config for the sclera stack.
# Two metric sources:
#   1. otel-collector:9464  — JVM/HTTP/DB metrics the OTEL agent exports from EVERY service
#                             (the collector re-exposes them in Prometheus format).
#   2. app:8085/actuator/prometheus — rich Micrometer/Spring metrics from the device-asset app.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:9464"]
        labels:
          source: otel-collector

  - job_name: sclera-cloud-device-asset
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8085"]
        labels:
          application: sclera-cloud-device-asset
