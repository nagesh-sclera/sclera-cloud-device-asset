# Test application properties for the JPA integration test harness.
# @SpringBootTest(classes=JpaTestConfig.class) loads a minimal JPA-only slice.
# @ServiceConnection (in PostgresJpaIT) wires the container datasource automatically.

# --- JPA ---
# ddl-auto=none: schema is created via @Sql /schema-pg.sql before each test class.
# This avoids Hibernate trying to render MySQL-backtick column names on PostgreSQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Force Hibernate/JDBC to negotiate UTC with PostgreSQL.
# The JVM default timezone (Asia/Calcutta) is rejected by PostgreSQL 16 because
# it recognizes only the IANA canonical name "Asia/Kolkata". Setting this to UTC
# avoids the connection-level timezone negotiation entirely.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP connection-init SQL: set PostgreSQL session timezone to UTC.
# This runs immediately after each new connection is established, overriding
# the JVM default timezone that PostgreSQL rejects ("Asia/Calcutta").
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Explicit entity scan package — needed because @EntityScan on JpaTestConfig may not
# be processed by HibernateJpaAutoConfiguration$PersistenceManagedTypesConfiguration
# when using @ImportAutoConfiguration. This property ensures the packages-to-scan
# is set directly on the Hibernate persistence unit.
# Suppress Flyway (it's on the classpath from the main pom but not autoconfigured
# in this test slice since JpaTestConfig uses @ImportAutoConfiguration only for JPA).
# Setting this as a safety net in case any Flyway bean sneaks in.
spring.flyway.enabled=false
