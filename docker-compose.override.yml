# Demo-only overrides (auto-merged by `docker compose`). NOT committed config.
#  1) A foreign `postgres` container holds host port 5432, so remap this stack's
#     Postgres to host 5433. Inter-service traffic uses the container network
#     (postgres:5432) and is unaffected.
#  2) daprio/scheduler runs as non-root and can't mkdir in the scheduler-data volume.
#     Run it as root for the demo so it can create its etcd data dir.
#
# NOTE: the JAVA_TOOL_OPTIONS:"" overrides that disabled the OTel javaagent were
# REMOVED — the agent jar (infra/otel/opentelemetry-javaagent.jar) is now a real
# 24MB jar, so the base-compose `-javaagent` is re-enabled for full request tracing
# (every HTTP controller + JDBC + Dapr call shows up in Jaeger).
services:
  postgres:
    ports:
      - "5433:5432"

  dapr-scheduler:
    user: "0:0"
