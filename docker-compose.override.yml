# Demo-only overrides (auto-merged by `docker compose`). NOT committed config.
#  1) A foreign `postgres` container holds host port 5432, so remap this stack's
#     Postgres to host 5433. Inter-service traffic uses the container network
#     (postgres:5432) and is unaffected.
#  2) DB-PER-SERVICE: each stateful service points at its OWN database (true
#     microservice DB isolation) instead of sharing sclera_assets via schemas.
#     The original sclera_assets DB is left intact as the rollback path.
#     TO REVERT: delete the `DB_URL` blocks below and run
#       docker compose up -d   (services fall back to sclera_assets from base compose)
#     then force-recreate the dapr sidecars. The new *_db databases can stay or be dropped.
#     (sclera-workorders already targets its own workorder_db via the base compose.)
#  3) The OTel javaagent jar (infra/otel/opentelemetry-javaagent.jar) is a REAL
#     24MB agent. It stays RE-ENABLED for `app` (sclera-cloud-device-asset) and the
#     api-gateway (via base compose) so the full frontend request trace reaches Jaeger.
#     vdms-service keeps its agent blanked below to save RAM; remove the override to
#     also capture its internal spans.
#
#  NOTE: The other business microservices (audit, identity, alerts, inventory,
#  inspection, integrations, edge, scheduler) were removed from the stack — only
#  device-asset (`app`), `vdms-service`, and `sclera-workorders` run here now.
services:
  postgres:
    ports:
      - "5433:5432"

  # --- Java services: blank JAVA_TOOL_OPTIONS where applicable; DB-per-service DB_URL ---
  app:                       # sclera-cloud-device-asset  (was: sclera_assets / public)
    environment:
      # OTel agent RE-ENABLED here (real 24MB jar now present) → inbound HTTP server
      # spans + SQL + request/response bodies for the full front-to-back request trace.
      DB_URL: jdbc:postgresql://postgres:5432/device_asset_db
  vdms-service:              # (was: sclera_assets / vdms_svc)  schema env unchanged
    environment:
      JAVA_TOOL_OPTIONS: ""
      DB_URL: jdbc:postgresql://postgres:5432/vdms_db
  sclera-workorders:
    environment:
      JAVA_TOOL_OPTIONS: ""
