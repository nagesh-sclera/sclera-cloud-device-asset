server:
  port: 8089

spring:
  application:
    name: sclera-vdms-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/vdms}
    username: ${DB_USER:root}
    password: ${DB_PASS:mypass123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: vdms_svc
